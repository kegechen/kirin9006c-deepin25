# 擎云 L540 内置声卡（da_combine_v5）：驱动的 DMA 周期写死为 960 帧（20ms，每个 DMA 节点 3840 字节），
# 却按 ALSA 协商的周期推进 hw_ptr。周期不是 960 时播放速度就不对：1024 快 6.7%（PipeWire 默认值，
# 断流、噼啪），1920 快一倍。硬件只支持 2 个周期，所以固定周期 960、按中断调度。
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound_DA_combine_v5.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size   = 960
        api.alsa.period-num    = 2
        api.alsa.disable-tsched = true
      }
    }
  }
]
