# 华为擎云 L540（麒麟 9006C，厂商内核 5.4.96）上运行 treeland 的适配：
# 1) 厂商内核开了 RT_GROUP_SCHED，system.slice 里设 SCHED_RR 会 EPERM，清空调度策略。
# 2) deepin 的 Mesa 没有 Mali-G78 驱动；用 UOS 自带的厂商 libmali（Valhall r23p0，拷到 /usr/local/lib/hisi-mali）做 GPU 渲染。
#    libmali-compat.so 补齐 libmali 与 deepin 用户态的接口差，并把这些变量从子进程环境里去掉。
# 3) libtl-norender.so：hisi 的 render 节点只是显示控制器，让 wlroots 改用 card0；dmabuf 导出补 O_RDWR。
# 回退到 llvmpipe 软件渲染：删掉 l541-malibuf.conf，本文件只留 CPUSchedulingPolicy= 和
#   Environment=LD_PRELOAD=/usr/local/lib/hisi-treeland/libtl-norender.so，然后 daemon-reload 并重启 treeland。
[Service]
CPUSchedulingPolicy=
Environment=LD_LIBRARY_PATH=/usr/local/lib/hisi-mali
Environment="LD_PRELOAD=/usr/local/lib/hisi-mali/libmali-compat.so /usr/local/lib/hisi-mali/libmali.so.0 /usr/local/lib/hisi-treeland/libtl-norender.so"
