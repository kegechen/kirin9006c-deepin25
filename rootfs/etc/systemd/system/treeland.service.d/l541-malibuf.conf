# 在 l540-no-rt.conf 的基础上，额外预加载 libtl-malibuf.so：给 treeland 补上厂商 libmali 客户端
# 需要的私有协议 mali_buffer_sharing v5，让 Wayland 客户端也能用 Mali GPU。
# 放在 hisi-mali 目录里，libmali-compat 会在 treeland 本体里把它从子进程环境中去掉。
# 关闭：rm 本文件，systemctl daemon-reload，systemctl restart treeland
#   （或临时加 Environment=TL_MALIBUF_DISABLE=1）
[Service]
Environment="LD_PRELOAD=/usr/local/lib/hisi-mali/libmali-compat.so /usr/local/lib/hisi-mali/libmali.so.0 /usr/local/lib/hisi-mali/libtl-malibuf.so /usr/local/lib/hisi-treeland/libtl-norender.so"
