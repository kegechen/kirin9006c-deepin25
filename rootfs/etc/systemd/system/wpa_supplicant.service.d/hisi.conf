# deepin 自带的 wpa_supplicant 2.10 会新建 p2p-dev-wlan0，Hi1103 驱动处理不了，卡死后占住 rtnl，整机网络相关进程全卡。
# 改用 UOS 带 +hisi 补丁的 2.9（驱动自带 p2p0）。OpenSSL 1.1 放在 /usr/local/lib/hisi-wpa。
[Service]
Environment=LD_LIBRARY_PATH=/usr/local/lib/hisi-wpa
ExecStart=
ExecStart=/usr/local/sbin/wpa_supplicant-hisi -u -s -O /run/wpa_supplicant
