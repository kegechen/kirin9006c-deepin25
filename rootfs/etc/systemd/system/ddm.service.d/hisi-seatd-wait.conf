# ddm 0.4 开机竞态：dde-seatd 是 Type=simple，ddm 的 After=dde-seatd.service 只保证进程已拉起，
# 不保证 /run/dde-seatd-control.sock 已经建好。ddm 连不上控制 socket（日志 "dde-seatd control event socket
# error ... Invalid name"）会直接段错误，原单元又是 StartLimitBurst=2/30 秒，开机连撞两次就放弃，屏幕不出登录界面。
# 2026-11-25 18:50 实测：ddm 13.17/13.39 两次崩溃，dde-seatd 13.77 才 "seatd started"。
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
# 最多等 10 秒控制 socket 出现；超时也照常启动（交给 Restart 兜底）
ExecStartPre=/bin/sh -c 'i=0; while [ ! -S /run/dde-seatd-control.sock ] && [ $$i -lt 100 ]; do sleep 0.1; i=$$((i+1)); done; exit 0'
RestartSec=1
