<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- hisi-bio-unlock（root 持有名字）：
     org.hisi.BioUnlock1        锁屏界面状态：只有 ddm 的 greeter 用户 dde（treeland 以它运行）能调用。状态信号按默认策略广播。
     org.hisi.BioUnlock1.Phone  手机指纹解锁：只有 hisi-phone-link 的运行用户 hisi-phone 能调用。
     org.hisi.BioUnlock1.Admin  配对 / 删除手机：只有 root（sudo hisi-phone ...）。
     org.hisi.BioUnlock1.User   控制中心“手机解锁”插件：谁都能调，服务按调用者的 uid 只给看、只给改他自己的手机
                                （其他系统用户直接拒绝）；配对新手机还要过 polkit（org.hisi.bio-unlock.pair-phone）。
     用户 hisi-phone 由 /etc/sysusers.d/hisi-phone.conf 建；dbus 读配置时用户还不存在，那条规则会被忽略，
     建好用户后要 systemctl reload dbus。 -->
<busconfig>
  <policy user="root">
    <allow own="org.hisi.BioUnlock1"/>
    <allow send_destination="org.hisi.BioUnlock1"/>
  </policy>
  <policy user="dde">
    <allow send_destination="org.hisi.BioUnlock1" send_interface="org.hisi.BioUnlock1"/>
  </policy>
  <policy user="hisi-phone">
    <allow send_destination="org.hisi.BioUnlock1" send_interface="org.hisi.BioUnlock1.Phone"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.hisi.BioUnlock1" send_interface="org.hisi.BioUnlock1.User"/>
    <!-- 用户会话的锁屏界面（treeland 以桌面用户跑）收 PhoneChanged 后要 GetPhone 取“手机已连接”的名字；
         手机名只在本机可读，和 StateChanged 广播用户名同级别，不进广播本身 -->
    <allow send_destination="org.hisi.BioUnlock1" send_interface="org.hisi.BioUnlock1" send_member="GetPhone"/>
  </policy>
</busconfig>
