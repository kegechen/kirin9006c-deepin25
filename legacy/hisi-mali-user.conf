# 让该用户服务用厂商 libmali（Mali-G78）做 GPU 渲染，而不是 Mesa llvmpipe 纯 CPU 渲染。
# 合成器没有 mali_buffer_sharing 时 libmali-compat 会自动回退 Mesa。删除本文件并重启服务即恢复原状。
[Service]
Environment=LD_LIBRARY_PATH=/usr/local/lib/hisi-mali
Environment="LD_PRELOAD=/usr/local/lib/hisi-mali/libmali-compat.so /usr/local/lib/hisi-mali/libmali.so.0"
