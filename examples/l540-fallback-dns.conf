# systemd-resolved 兜底 DNS（示例）。放到 /etc/systemd/resolved.conf.d/ 下，然后 systemctl restart systemd-resolved。
# 背景：Windows 移动热点（ICS）的 DNS 代理经常不响应，表现为能 ping 通 IP、但域名解析失败
# （控制中心下载动态壁纸报 getaddrinfo (16: Device or resource busy)）。
# 把第一个换成你所在网络可达的 DNS；223.5.5.5 是公共 DNS，作为最后兜底。
[Resolve]
DNS=<可达的内网或运营商 DNS> 223.5.5.5
