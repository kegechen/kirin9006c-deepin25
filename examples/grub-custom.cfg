# UOS Boot 分区（ext4，平时不挂载）上的 /grub/custom.cfg 示例：开机进 deepin 25（Rootb）的入口。
# deepin 25 用户态装在 Rootb，沿用 UOS 的厂商内核与 initrd。
#
# 用法：
#   1. 把 <BOOT_UUID> 换成 UOS Boot 分区的 UUID，<ROOTB_UUID> 换成 Rootb 的 UUID（lsblk -f 查）。
#   2. linux 那一行最好从 UOS 自己的 /boot/grub/grub.cfg 里复制（boardid、printktimer 等是这台机器的板级参数），
#      只把 root= 改成 Rootb，并在末尾追加 init=/usr/local/sbin/d25-init。
#   3. 默认启动项保持 UOS 不变，用 grub-reboot deepin25-rootb 一次性进入；断电或重启就回到 UOS。
#      不要在 deepin 里跑 update-grub（会改掉 UOS Boot 分区的 grub.cfg）。
#   4. d25.probe=1 是可选的开机探针：90 秒后 PID 1 还卡在 clone 时抓栈并重启，稳定后可以去掉。
menuentry 'Deepin 25.3 (Rootb, UOS kernel)' --class uos --class gnu-linux --class gnu --class os $menuentry_id_option 'deepin25-rootb' {
	load_video
	insmod gzio
	if [ x$grub_platform = xxen ]; then insmod xzio; insmod lzopio; fi
	insmod part_gpt
	insmod ext2
	set root='hd3,gpt2'
	if [ x$feature_platform_search_hint = xy ]; then
	  search --no-floppy --fs-uuid --set=root --hint-bios=hd3,gpt2 --hint-efi=hd3,gpt2 --hint-baremetal=ahci3,gpt2  <BOOT_UUID>
	else
	  search --no-floppy --fs-uuid --set=root <BOOT_UUID>
	fi
	linux	/vmlinuz-5.4.96-arm64-desktop root=UUID=<ROOTB_UUID> ro   earlycon=pl011,0xFFF02000 maxcpus=8 printktimer=0xfa89b000,0x534,0x538 rcupdate.rcu_expedited=1 buildvariant=eng pmu_nv_addr=0x0 boardid=0x2456 normal_reset_type=fastbootd boot_slice=0x107573 reboot_reason=COLD_BOOT exception_subtype=no last_bootup_keypoint=38 swiotlb=2 dma_zone_only=true kce_status=0 efuse_status=2 nokaslr hhee_enable=false   console=ttyAMA6,115200 usbcore.autosuspend=-1 plymouth.ignore-serial-consoles pcie_aspm=off fsck.repair=yes fsck.mode=force DEEPIN_GFXMODE=$DEEPIN_GFXMODE ima_appraise=off selinux=0 checkreqprot=1  libahci.ignore_sss=1 panic=10 quiet loglevel=0 plymouth.enable=0 systemd.show_status=1 console=tty0 init=/usr/local/sbin/d25-init d25.probe=1
	initrd	/initrd.img-5.4.96-arm64-desktop
	boot
}
